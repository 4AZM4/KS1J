name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ks1j/shared test
      - run: pnpm typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and seed, then run rule tests
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/tests/rules.sql
